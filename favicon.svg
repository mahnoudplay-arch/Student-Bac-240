<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- Vibrant Electric Gradients -->
    <linearGradient id="neonIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="cyanSpark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters for Gloss and Bloom -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadowDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#borderGlow)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Futuristic Ambient Hexagon / Circuit Matrix Background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="180" stroke-dasharray="8 12"/>
    <circle cx="256" cy="256" r="220" stroke-dasharray="4 16"/>
    <path d="M256,40 L256,90 M256,422 L256,472 M40,256 L90,256 M422,256 L472,256"/>
  </g>

  <!-- Futuristic Star / Academic Diamond Crest at the Top -->
  <g transform="translate(256, 125)" filter="url(#bloom)">
    <!-- Academic Mortarboard Graduation Shield Silhouette -->
    <path d="M0,-42 L72,-14 L0,14 L-72,-14 Z" fill="url(#cyanSpark)"/>
    <path d="M-45,-4 L0,14 L45,-4 L45,18 C45,36 0,52 0,52 C0,52 -45,36 -45,18 Z" fill="url(#neonIndigo)" opacity="0.9"/>
    <!-- Glowing Core Tassel Star -->
    <circle cx="0" cy="-14" r="7" fill="#ffffff"/>
    <line x1="72" y1="-14" x2="80" y2="18" stroke="url(#goldCap)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="80" cy="22" r="5" fill="url(#goldCap)"/>
  </g>

  <!-- Bold Tech Emblem '240' -->
  <g filter="url(#shadowDepth)" text-anchor="middle">
    <!-- BAC Ribbon Label -->
    <rect x="180" y="212" width="152" height="30" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="256" y="233" fill="#a5b4fc" font-family="'Cairo', system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="4">BAC SYRIA</text>

    <!-- Huge Glowing 240 Numerals -->
    <text x="256" y="365" fill="url(#cyanSpark)" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-weight="900" font-size="142" letter-spacing="-4" filter="url(#bloom)">
      240
    </text>
    <text x="256" y="365" fill="#ffffff" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-weight="900" font-size="142" letter-spacing="-4" opacity="0.95">
      240
    </text>
  </g>

  <!-- Base Scientific Energy Arc -->
  <path d="M120,410 C180,442 332,442 392,410" fill="none" stroke="url(#cyanSpark)" stroke-width="6" stroke-linecap="round" filter="url(#bloom)"/>
  <circle cx="256" cy="428" r="5" fill="#38bdf8"/>
</svg>
